[project]
name = "worker-supervisor"
version = "0.1.0"
description = "SDK worker supervisor - local autonomous worker fleets (ADR-0028 / ECA-60, design of record in evolv-coder-agent docs)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.128",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "fastmcp>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
workers = "worker_supervisor.cli:main"
worker-supervisor = "worker_supervisor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_supervisor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ECA-146 AC#2: a hang must never read as a pass. The default suite runs in
# under 10s and every scripted test is bounded by its own wall_clock_s (<=5s in
# the shared `cfg` fixture), so 30s is generous slack, not a tight fit — a test
# that needs longer (a real CLI turn) marks itself with
# @pytest.mark.timeout(N) rather than raising this default for everyone.
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"
